<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07c160">
  <title>点菜小程序</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <button class="back-btn" id="back-btn" onclick="goBack()" style="display:none">‹</button>
    <h1 id="page-title">菜单</h1>
    <button class="header-action" id="header-action" onclick="logout()" style="display:none">退出</button>
  </div>

  <!-- ==================== Recommend Page (Chat) ==================== -->
  <div class="page" id="recommend-page">
    <div style="display:flex;flex-direction:column;height:calc(100vh - 100px)">
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px;padding-bottom:8px"></div>
      <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;background:#fff">
        <input class="form-input" id="chat-input" placeholder="跟AI助手说你想吃什么..." style="flex:1;border-radius:20px" onkeydown="if(event.key==='Enter') sendChat()">
        <button class="btn btn-primary" onclick="sendChat()" style="border-radius:50%;width:44px;height:44px;padding:0;font-size:18px">➤</button>
      </div>
    </div>
  </div>

  <!-- ==================== Menu Page ==================== -->
  <div class="page active" id="menu-page">
    <div style="display:flex;height:calc(100vh - 100px);overflow:hidden">
      <!-- 左侧分类 -->
      <div id="menu-sidebar" style="width:88px;flex-shrink:0;overflow-y:auto;background:#f8f8f8;border-right:1px solid #eee;padding:8px 0">
      </div>
      <!-- 右侧菜品 -->
      <div id="menu-content" style="flex:1;overflow-y:auto;padding:12px;padding-bottom:80px">
        <div id="dish-list"></div>
      </div>
    </div>
  </div>

  <!-- ==================== Cart Page ==================== -->
  <div class="page" id="cart-page">
    <div class="container" id="cart-container">
      <div id="cart-list">
        <div class="cart-empty">
          <div class="empty-icon">🛒</div>
          <div>购物车是空的</div>
          <button class="btn btn-primary mt-16" onclick="showPage('menu-page')">去点餐</button>
        </div>
      </div>
    </div>
    <div class="fixed-bottom" id="cart-bottom-bar" style="display:none">
      <div style="display:flex;align-items:center;gap:12px;width:100%">
        <div class="cart-total">合计: <span id="cart-total" style="color:var(--red);font-size:20px;font-weight:700">¥0.00</span></div>
        <button class="btn btn-primary" onclick="showOrderConfirm()" style="margin-left:auto">去结算</button>
      </div>
    </div>
  </div>

  <!-- ==================== Orders Page ==================== -->
  <div class="page" id="orders-page">
    <div class="container">
      <div class="order-status-bar">
        <div class="category-tab active" data-status="all" onclick="filterOrder('all')">全部</div>
        <div class="category-tab" data-status="pending" onclick="filterOrder('pending')">待处理</div>
        <div class="category-tab" data-status="confirmed" onclick="filterOrder('confirmed')">已确认</div>
        <div class="category-tab" data-status="preparing" onclick="filterOrder('preparing')">制作中</div>
        <div class="category-tab" data-status="completed" onclick="filterOrder('completed')">已完成</div>
        <div class="category-tab" data-status="cancelled" onclick="filterOrder('cancelled')">已取消</div>
      </div>
      <div id="order-list"></div>
    </div>
  </div>

  <!-- ==================== Admin Page ==================== -->
  <div class="page" id="admin-page">
    <div class="container">
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" id="stats-active">-</div><div class="stat-label">在售菜品</div></div>
        <div class="stat-box"><div class="stat-num" id="stats-pending">-</div><div class="stat-label">待审核</div></div>
        <div class="stat-box"><div class="stat-num" id="stats-orders">-</div><div class="stat-label">待处理订单</div></div>
      </div>

      <div class="admin-nav" style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto">
        <div class="category-tab active" data-tab="dishes" onclick="switchAdminTab('dishes')">菜品</div>
        <div class="category-tab" data-tab="categories" onclick="switchAdminTab('categories')">分类</div>
        <div class="category-tab" data-tab="orders" onclick="switchAdminTab('orders')">订单</div>
        <div class="category-tab" data-tab="pending" onclick="switchAdminTab('pending')">审核</div>
        <div class="category-tab" data-tab="users" onclick="switchAdminTab('users')">用户</div>
        <div class="category-tab" data-tab="materials" onclick="switchAdminTab('materials')">材料</div>
      </div>

      <div id="admin-tab-dishes" class="admin-tab">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="form-input" id="dish-search" placeholder="搜索菜品名称" style="flex:1" oninput="searchAdminDishes()">
          <button class="btn btn-small btn-primary" id="admin-add-dish-btn" onclick="showAdminDishModal(null)">+ 新增</button>
        </div>
        <div id="admin-dish-list"></div>
      </div>

      <div id="admin-tab-orders" class="admin-tab" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="form-input" id="order-search" placeholder="搜索订单号" style="flex:1" oninput="searchAdminOrders()">
          <button class="btn btn-small btn-outline" style="color:var(--red)" onclick="batchDeleteSelectedOrders()" id="batch-delete-orders-btn">批量删除</button>
        </div>
        <div id="admin-order-list"></div>
      </div>

      <div id="admin-tab-pending" class="admin-tab" style="display:none">
        <div id="admin-pending-list"></div>
      </div>

      <div id="admin-tab-materials" class="admin-tab" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="form-input" id="material-search" placeholder="搜索材料名称" style="flex:1" oninput="searchAdminMaterials()">
          <button class="btn btn-small btn-primary" onclick="showAddMaterialModal()">+ 新增</button>
          <button class="btn btn-small btn-outline" style="color:var(--red)" onclick="batchDeleteSelectedMaterials()">批量删除</button>
        </div>
        <div id="admin-material-list"></div>
      </div>

      <div id="admin-tab-categories" class="admin-tab" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="form-input" id="new-cat-name" placeholder="输入分类名称" style="flex:1">
          <button class="btn btn-primary btn-small" onclick="adminAddCategory()">新增</button>
        </div>
        <div id="admin-category-list"></div>
      </div>

      <div id="admin-tab-users" class="admin-tab" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="form-input" id="user-search" placeholder="搜索用户名" style="flex:1" oninput="searchAdminUsers()">
          <button class="btn btn-small btn-primary" onclick="showAddUserModal()">+ 新增</button>
          <button class="btn btn-small btn-outline" style="color:var(--red)" onclick="batchDeleteSelectedUsers()">批量删除</button>
        </div>
        <div id="admin-user-list"></div>
      </div>
    </div>
  </div>

  <!-- ==================== Profile / Login Page ==================== -->
  <div class="page" id="profile-page">
    <div class="container">
      <div class="card" style="margin-top:40px;text-align:center" id="profile-logged-in">
        <div id="profile-avatar" style="font-size:64px;margin-bottom:8px;position:relative;display:inline-block;cursor:pointer" onclick="showProfileEdit()">
          👤
          <span style="font-size:12px;position:absolute;bottom:0;right:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:2px solid #fff">✏️</span>
        </div>
        <div style="font-size:20px;font-weight:600" id="user-name-display">未登录</div>
        <div style="font-size:14px;color:var(--text-secondary)" id="user-role-display"></div>
        <div style="font-size:13px;color:#999;margin-top:4px" id="user-bio-display"></div>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-outline btn-block" onclick="showProfileEdit()">✏️ 编辑资料</button>
          <button class="btn btn-outline btn-block" id="admin-entry-btn" onclick="showPage('admin-page'); initAdmin();" style="display:none">⚙️ 管理后台</button>
          <button class="btn btn-outline btn-block" id="logout-btn" onclick="logout()" style="display:none;color:var(--red);border-color:var(--red)">退出登录</button>
        </div>
      </div>

      <div class="card" id="profile-login-form" style="margin-top:40px">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:48px;margin-bottom:8px">🔐</div>
          <div style="font-size:18px;font-weight:600">登录</div>
        </div>
        <div class="form-group">
          <label>用户名</label>
          <input class="form-input" id="login-username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-input" id="login-password" type="password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary btn-block mt-16" onclick="doLogin()" id="login-btn">登录</button>
        <div id="login-error" style="color:var(--red);text-align:center;margin-top:12px;display:none"></div>
      </div>

      <div class="card mt-16" style="display:none" id="pending-section"></div>
    </div>
  </div>

  <!-- ==================== Detail Page ==================== -->
  <div class="page" id="detail-page">
    <div class="container" id="detail-content"></div>
  </div>

  <!-- ==================== Bottom Navigation ==================== -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="menu-page" onclick="showPage('menu-page')">
      <span class="nav-icon">🍽️</span>
      菜单
    </div>
    <div class="nav-item" data-page="recommend-page" onclick="showPage('recommend-page'); loadRecommend();">
      <span class="nav-icon">🤖</span>
      推荐
    </div>
    <div class="nav-item" data-page="cart-page" onclick="showPage('cart-page'); renderCart();">
      <span class="nav-icon">🛒</span>
      购物车 <span class="cart-badge" style="display:none;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;vertical-align:top">0</span>
    </div>
    <div class="nav-item" data-page="orders-page" onclick="showPage('orders-page'); loadOrders();">
      <span class="nav-icon">📋</span>
      订单
    </div>
    <div class="nav-item" data-page="profile-page" onclick="showPage('profile-page'); initProfile();">
      <span class="nav-icon">👤</span>
      我的
    </div>
  </div>

  <!-- ==================== Modals ==================== -->
  <!-- Dish Modal -->
  <div class="modal-overlay hidden" id="dish-modal" onclick="document.getElementById('dish-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 id="dish-modal-title">新增菜品</h3>
      <div id="dish-form"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('dish-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="saveDish()">保存</button>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal-overlay hidden" id="review-modal" onclick="document.getElementById('review-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>审核待定价菜品</h3>
      <div id="review-form"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('review-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="submitReview()">确认通过</button>
      </div>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div class="modal-overlay hidden" id="profile-modal" onclick="document.getElementById('profile-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>编辑资料</h3>
      <div class="form-group">
        <label>昵称</label>
        <input class="form-input" id="f-profile-name" placeholder="你的昵称">
      </div>
      <div class="form-group">
        <label>头像</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input class="form-input" id="f-profile-avatar" placeholder="头像URL或上传" style="flex:1">
          <button class="btn btn-small btn-primary" onclick="uploadAvatar()" style="flex-shrink:0">上传</button>
        </div>
      </div>
      <div class="form-group">
        <label>个人简介</label>
        <textarea class="form-textarea" id="f-profile-bio" placeholder="介绍一下自己..." maxlength="256"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('profile-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="saveProfile()">保存</button>
      </div>
    </div>
  </div>

  <!-- Order Confirm Modal -->
  <div class="modal-overlay hidden" id="order-modal" onclick="document.getElementById('order-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>确认订单</h3>
      <div id="order-confirm-items" style="margin-bottom:16px"></div>
      <div class="form-group">
        <label>备注（选填）</label>
        <textarea class="form-textarea" id="order-note" placeholder="口味要求、特殊备注等" maxlength="500"></textarea>
      </div>
      <div class="flex-between" style="font-size:18px;font-weight:600;margin-bottom:16px">
        <span>合计</span>
        <span style="color:var(--red)" id="order-confirm-total">¥0.00</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('order-modal').classList.add('hidden')">再想想</button>
        <button class="btn btn-primary" onclick="submitOrder()">确认下单</button>
      </div>
    </div>
  </div>

  <!-- User Modal -->
  <div class="modal-overlay hidden" id="user-modal" onclick="document.getElementById('user-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 id="user-modal-title">新增用户</h3>
      <div class="form-group">
        <label>用户名</label>
        <input class="form-input" id="f-user-username" placeholder="登录用">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" id="f-user-password" type="password" placeholder="初始密码">
      </div>
      <div class="form-group">
        <label>昵称（选填）</label>
        <input class="form-input" id="f-user-nickname" placeholder="显示名称">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select class="form-select" id="f-user-role">
          <option value="user">点餐用户</option>
          <option value="chef">厨师</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('user-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="saveUser()">保存</button>
      </div>
    </div>
  </div>

  <!-- Material Modal -->
  <div class="modal-overlay hidden" id="material-modal" onclick="document.getElementById('material-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 id="material-modal-title">新增材料</h3>
      <div class="form-group">
        <label>材料名称</label>
        <input class="form-input" id="f-mat-name" placeholder="如: 猪肉、盐">
      </div>
      <div class="form-group">
        <label>分类（选填）</label>
        <select class="form-select" id="f-mat-category">
          <option value="">无分类</option>
          <option value="肉类">肉类</option>
          <option value="蔬菜">蔬菜</option>
          <option value="调料">调料</option>
          <option value="主食">主食</option>
          <option value="豆制品">豆制品</option>
          <option value="海鲜">海鲜</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>是否为常见过敏原</label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="f-mat-allergen">
          是
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('material-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="saveMaterial()">保存</button>
      </div>
    </div>
  </div>

  <!-- Submit Pending Modal -->
  <div class="modal-overlay hidden" id="pending-modal" onclick="document.getElementById('pending-modal').classList.add('hidden')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>提交新菜品</h3>
      <div class="form-group">
        <label>菜品名称</label>
        <input class="form-input" id="f-pending-name" placeholder="请输入菜品名称">
      </div>
      <div class="form-group">
        <label>描述（选填）</label>
        <textarea class="form-textarea" id="f-pending-desc" placeholder="菜品描述"></textarea>
      </div>
      <div class="form-group">
        <label>建议价格（选填）</label>
        <input class="form-input" id="f-pending-price" type="number" step="0.01" placeholder="建议价格">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="document.getElementById('pending-modal').classList.add('hidden')">取消</button>
        <button class="btn btn-primary" onclick="submitPendingDish()">提交</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
